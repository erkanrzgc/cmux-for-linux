[package]
name = "cmux-linux"
version = "0.1.0"
description = "Unofficial cmux desktop client for Debian and Kali Linux"
authors = ["cmux-linux contributors"]
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "cmux_linux"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
uuid = { version = "1", features = ["v4"] }

# Keep the Tauri dependency graph independent from the upstream cmux-tui lockfile.
[workspace]
